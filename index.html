<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Ledger</h1>
      <p class="subtitle">Track your expenses</p>
    </header>

    <section class="form-card">
      <h2>Add Expense</h2>
      <form id="expense-form">
        <div class="field">
          <label for="amount">Amount</label>
          <div class="amount-wrap">
            <span class="currency">$</span>
            <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
          </div>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="Food & Drink">Food & Drink</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="note">Note <span class="optional">(optional)</span></label>
          <input type="text" id="note" placeholder="What was this for?" maxlength="120" />
        </div>

        <button type="submit" class="btn-primary">Add Expense</button>
      </form>
    </section>

    <section class="summary-bar" id="summary-bar">
      <div class="summary-item">
        <span class="summary-label">Total</span>
        <span class="summary-value" id="total">$0.00</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">This month</span>
        <span class="summary-value" id="month-total">$0.00</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Entries</span>
        <span class="summary-value" id="count">0</span>
      </div>
    </section>

    <section class="list-section">
      <div class="list-header">
        <h2>Expenses</h2>
        <div class="list-controls">
          <select id="filter-category">
            <option value="">All categories</option>
            <option value="Food & Drink">Food & Drink</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <button class="btn-ghost" id="clear-all" title="Clear all expenses">Clear all</button>
        </div>
      </div>
      <ul id="expense-list" class="expense-list">
        <li class="empty-state" id="empty-state">No expenses yet. Add one above.</li>
      </ul>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
