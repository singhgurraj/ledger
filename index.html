<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <div class="app-title">Ledger</div>

    <!-- Hero total -->
    <header class="hero">
      <div class="hero-label">Total spent</div>
      <div class="hero-total" id="total">$0.00</div>
      <div class="hero-stats">
        <span class="hero-stat"><span class="hero-stat-value" id="year-total">$0.00</span> this year</span>
        <span class="hero-divider">·</span>
        <span class="hero-stat"><span class="hero-stat-value" id="month-total">$0.00</span> this month</span>
        <span class="hero-divider">·</span>
        <span class="hero-stat"><span class="hero-stat-value" id="count">0</span> entries</span>
        <span class="hero-divider">·</span>
        <button class="hero-budget-btn" id="budget-btn" aria-label="Set monthly budget">
          <span id="budget-display">Set budget</span>
        </button>
      </div>
      <form class="budget-form" id="budget-form" hidden>
        <span class="budget-form-label">Monthly budget</span>
        <div class="budget-amount-wrap">
          <span class="budget-currency">$</span>
          <input type="number" id="budget-input" placeholder="0" min="1" step="1" />
        </div>
        <button type="submit" class="budget-form-save">Save</button>
        <button type="button" id="budget-cancel" class="budget-form-cancel">Cancel</button>
      </form>
    </header>

    <!-- Budget alert -->
    <div class="budget-alert" id="budget-alert" role="alert" aria-live="polite" hidden>
      <svg class="budget-alert-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 1.5L1 14h14L8 1.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 6v4M8 11.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span id="budget-alert-msg"></span>
    </div>

    <!-- Category breakdown -->
    <section class="breakdown-section" id="breakdown-section" hidden>
      <div class="breakdown-header">By category</div>
      <ul class="breakdown-list" id="breakdown-list"></ul>
    </section>

    <!-- Expense list -->
    <section class="list-section">
      <div class="list-header">
        <h2>Expenses</h2>
        <div class="list-controls">
          <select id="filter-category">
            <option value="">All categories</option>
            <option value="Food & Drink">Food &amp; Drink</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <button class="btn-filter" id="favorites-toggle" aria-pressed="false">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M7 1l1.545 3.13L12 4.635l-2.5 2.435.59 3.44L7 8.885 3.91 10.51l.59-3.44L2 4.635l3.455-.505L7 1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            Favorites
          </button>
          <button class="btn-ghost" id="export-csv">Export CSV</button>
          <button class="btn-ghost" id="clear-all">Clear all</button>
        </div>
      </div>
      <div class="month-export" id="month-export" hidden>
        <label for="month-export-select">Export month</label>
        <select id="month-export-select"><option value="">Select a month…</option></select>
        <button class="btn-ghost" id="month-export-btn">Export CSV</button>
      </div>

      <div class="search-bar">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
          <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input type="search" id="search" placeholder="Search descriptions…" autocomplete="off" />
        <button class="search-clear" id="search-clear" aria-label="Clear search" hidden>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="tag-cloud" id="tag-cloud" hidden></div>
      <div class="filter-subtotal" id="filter-subtotal" hidden>
        <span class="filter-subtotal-label" id="filter-subtotal-label"></span>
        <span class="filter-subtotal-amount" id="filter-subtotal-amount"></span>
      </div>
      <ul id="expense-list" class="expense-list"></ul>
    </section>

  </div>

  <!-- Floating add button -->
  <button class="fab" id="open-modal" aria-label="Add expense">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Modal backdrop + drawer -->
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-drawer" id="modal-drawer" role="dialog" aria-modal="true" aria-label="Add expense">
    <div class="drawer-handle"></div>
    <h2 class="drawer-title">Add Expense</h2>
    <form id="expense-form">
      <div class="field">
        <label for="amount">Amount</label>
        <div class="amount-wrap">
          <span class="currency">$</span>
          <input type="number" id="amount" placeholder="0.00" step="0.01" required />
        </div>
        <p class="field-error" id="amount-error" hidden></p>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="" disabled selected>Select a category</option>
          <option value="Food & Drink">Food &amp; Drink</option>
          <option value="Transport">Transport</option>
          <option value="Housing">Housing</option>
          <option value="Health">Health</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Utilities">Utilities</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="note">Note <span class="optional">(optional)</span></label>
        <input type="text" id="note" placeholder="What was this for?" maxlength="120" />
      </div>
      <div class="field">
        <label for="tags">Tags <span class="optional">(optional)</span></label>
        <input type="text" id="tags" placeholder="work, travel, client…" maxlength="200" autocomplete="off" />
      </div>
      <div class="field field-split">
        <label class="split-label">
          <input type="checkbox" id="split-toggle" />
          Split evenly
        </label>
        <div class="split-controls" id="split-controls" hidden>
          <span class="split-divider">÷</span>
          <input type="number" id="split-count" value="2" min="2" max="99" step="1" />
          <span class="split-people-label">people</span>
          <span class="split-share-preview" id="split-share-preview"></span>
        </div>
      </div>
      <div class="field">
        <label>Receipt <span class="optional">(optional)</span></label>
        <div class="receipt-upload-area">
          <input type="file" id="receipt-input" accept="image/*" style="display:none" />
          <label for="receipt-input" class="receipt-upload-label" id="receipt-upload-label">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
              <path d="M7.5 1v8M5 4.5l2.5-3.5 2.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 11v1.5A1.5 1.5 0 003.5 14h8a1.5 1.5 0 001.5-1.5V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Attach photo</span>
          </label>
          <div class="receipt-upload-preview" id="receipt-upload-preview" hidden>
            <img class="receipt-upload-img" id="receipt-upload-img" alt="Receipt preview" />
            <span class="receipt-upload-filename" id="receipt-upload-filename"></span>
            <button type="button" class="receipt-upload-clear" id="receipt-upload-clear" aria-label="Remove receipt">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="dupe-warning" id="dupe-warning" hidden>
        <svg class="dupe-warning-icon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1.5L1 14h14L8 1.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M8 6v4M8 11.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="dupe-warning-body">
          <p class="dupe-warning-msg" id="dupe-warning-msg"></p>
          <div class="dupe-warning-actions">
            <button type="button" id="dupe-cancel">Cancel</button>
            <button type="button" id="dupe-add-anyway">Add anyway</button>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-primary">Add Expense</button>
    </form>
  </div>

  <!-- Receipt export dialog -->
  <div class="dialog-backdrop" id="receipt-backdrop"></div>
  <div class="receipt-dialog" id="receipt-dialog" role="dialog" aria-modal="true" aria-labelledby="receipt-dialog-title">
    <div class="receipt-dialog-header">
      <h3 id="receipt-dialog-title" class="receipt-dialog-title">Export Expense</h3>
      <button class="receipt-dialog-close" id="receipt-close" aria-label="Close dialog">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="receipt-preview" id="receipt-preview"></div>
    <div class="receipt-dialog-footer">
      <button class="btn-secondary" id="receipt-cancel">Cancel</button>
      <button class="btn-primary receipt-download-btn" id="receipt-download">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 1v7.5M4.5 6L7 8.5 9.5 6M2 11v1a1 1 0 001 1h8a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Download PDF
      </button>
    </div>
  </div>

  <!-- Image lightbox -->
  <div class="img-lightbox" id="img-lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close image">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <img class="lightbox-img" id="lightbox-img" alt="Receipt" />
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
