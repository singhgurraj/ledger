<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <div class="app-title">Ledger</div>

    <!-- Hero total -->
    <header class="hero">
      <div class="hero-label">Total spent</div>
      <div class="hero-total" id="total">$0.00</div>
      <div class="hero-stats">
        <span class="hero-stat"><span class="hero-stat-value" id="month-total">$0.00</span> this month</span>
        <span class="hero-divider">·</span>
        <span class="hero-stat"><span class="hero-stat-value" id="count">0</span> entries</span>
      </div>
    </header>

    <!-- Expense list -->
    <section class="list-section">
      <div class="list-header">
        <h2>Expenses</h2>
        <div class="list-controls">
          <select id="filter-category">
            <option value="">All categories</option>
            <option value="Food & Drink">Food & Drink</option>
            <option value="Transport">Transport</option>
            <option value="Housing">Housing</option>
            <option value="Health">Health</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Utilities">Utilities</option>
            <option value="Other">Other</option>
          </select>
          <button class="btn-ghost" id="clear-all">Clear all</button>
        </div>
      </div>
      <div class="filter-subtotal" id="filter-subtotal" hidden>
        <span class="filter-subtotal-label" id="filter-subtotal-label"></span>
        <span class="filter-subtotal-amount" id="filter-subtotal-amount"></span>
      </div>
      <ul id="expense-list" class="expense-list"></ul>
    </section>

  </div>

  <!-- Floating add button -->
  <button class="fab" id="open-modal" aria-label="Add expense">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <path d="M11 3v16M3 11h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Modal backdrop + drawer -->
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-drawer" id="modal-drawer" role="dialog" aria-modal="true" aria-label="Add expense">
    <div class="drawer-handle"></div>
    <h2 class="drawer-title">Add Expense</h2>
    <form id="expense-form">
      <div class="field">
        <label for="amount">Amount</label>
        <div class="amount-wrap">
          <span class="currency">$</span>
          <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required />
        </div>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="" disabled selected>Select a category</option>
          <option value="Food & Drink">Food & Drink</option>
          <option value="Transport">Transport</option>
          <option value="Housing">Housing</option>
          <option value="Health">Health</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Utilities">Utilities</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="note">Note <span class="optional">(optional)</span></label>
        <input type="text" id="note" placeholder="What was this for?" maxlength="120" />
      </div>
      <button type="submit" class="btn-primary">Add Expense</button>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
